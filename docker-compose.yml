# Local PostgreSQL for development (D-51). Laravel itself runs from Laragon.
# Docker Compose reads DB_PORT / DB_DATABASE / DB_USERNAME / DB_PASSWORD from .env.
services:
  postgres:
    image: postgres:16
    container_name: crowdchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-crowdchain}
      POSTGRES_USER: ${DB_USERNAME:-crowdchain}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env first}
    ports:
      # Host port = DB_PORT in .env, so Laravel and Docker always agree.
      # Use DB_PORT=5433 if another PostgreSQL (e.g. Laragon's) already uses 5432.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
