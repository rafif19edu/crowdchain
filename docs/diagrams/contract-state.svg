<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="660px" preserveAspectRatio="none" style="width:1092px;height:660px;background:#FFFFFF;" version="1.1" viewBox="0 0 1092 660" width="1092px" zoomAndPan="magnify"><title>CrowdChainEscrow &#8212; Campaign State (on-chain)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="340.5664" x="368.8852" y="23.5625">CrowdChainEscrow &#8212; Campaign State (on-chain)</text><ellipse cx="337.35" cy="53.9395" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="Active"><rect fill="#F1F1F1" height="80.498" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="254.3574" x="210.35" y="156.9395"/><line style="stroke:#181818;stroke-width:0.5;" x1="210.35" x2="464.7074" y1="183.8789" y2="183.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="41.6582" x="316.6996" y="175.502">Active</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183.4863" x="215.35" y="200.5039">donate() accepted until deadline</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.3574" x="215.35" y="215.0234">weekly: releaseStage() / markUnfunded()</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="114.9844" x="222.1" y="229.543">per scheduled week</text></g><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="60.1211" x="511.35" y="350.4395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.1211" x="516.35" y="375.5322">Funded</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="77.7236" x="94.35" y="424.9395"/><text fill="#00000